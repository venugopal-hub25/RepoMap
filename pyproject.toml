
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomap-cli"
version = "0.1.0"
description = "A lightweight Python CLI tool to scan and visualize repository structures."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
repomap = "repomap.cli:main"

[tool.setuptools.packages.find]
include = ["repomap*"]
